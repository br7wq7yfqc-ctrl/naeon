name: NAEON CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets / large files
        run: |
          echo "Checking for accidentally committed secrets and large binaries..."
          if git ls-files | grep -E '\.env$|id_rsa|id_ed25519|\.pem$|credentials'; then
            echo "ERROR: Secret-like files are tracked by git!"
            git ls-files | grep -E '\.env$|id_rsa|id_ed25519|\.pem$|credentials'
            exit 1
          fi
          find . -type f -size +20M -not -path './.git/*' | while read f; do
            echo "WARNING: Large file detected: $f"
          done

      - name: Check Godot project exists
        run: |
          if [ ! -f godot/project.godot ]; then
            echo "ERROR: godot/project.godot not found"
            exit 1
          fi
          echo "Godot project found."

      - name: Validate .gitignore has assets protection
        run: |
          if ! grep -q '/assets/' .gitignore; then
            echo "ERROR: /assets/ is not in .gitignore"
            exit 1
          fi
          echo ".gitignore OK"

  godot-headless:
    name: Godot Headless Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project (headless)
        working-directory: godot
        run: |
          godot --headless --editor --quit-after 30 || true
          echo "Project import finished (or timed out safely)"

      - name: Check for parse errors in scripts
        working-directory: godot
        run: |
          godot --headless --check-only --path . 2>&1 | tee godot_check.log || true
          if grep -i "error" godot_check.log | grep -v "WARNING" | grep -v "Optional"; then
            echo "Possible errors found in Godot check:"
            grep -i "error" godot_check.log
          fi
          echo "Godot headless check completed"

  export-windows:
    name: Export Windows
    runs-on: ubuntu-latest
    needs: godot-headless
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 + templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Create export presets if missing
        working-directory: godot
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "No export_presets.cfg yet — creating minimal placeholder"
            cat > export_presets.cfg << 'EOF'
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/windows/NAEON.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="NAEXOS"
application/product_name="NAEON"
application/file_description="NAEON"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
EOF
          fi

      - name: Export Windows
        working-directory: godot
        run: |
          mkdir -p ../build/windows
          godot --headless --export-release "Windows Desktop" ../build/windows/NAEON.exe || echo "Export failed or presets incomplete — this is expected at early stage"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: naeon-windows
          path: build/windows/
          if-no-files-found: ignore

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate, godot-headless]
    if: always()
    steps:
      - name: Result
        run: |
          echo "NAEON CI finished"
          echo "Validate: ${{ needs.validate.result }}"
          echo "Godot:    ${{ needs.godot-headless.result }}"
